[project]
name = "nameplate"
version = "0.1.0"
description = "Office-door name plate generator: raised lettering, STL + OpenSCAD output"
requires-python = ">=3.13"
dependencies = [
    "manifold3d>=3.5.4",
    "mapbox-earcut>=2.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "shapely>=2.0",
    "trimesh>=4.0",
]

[project.scripts]
nameplate = "nameplate:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
